<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontBench</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script> -->
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Side Navigation -->
        <nav class="side-nav">
            <div class="nav-top">
                <div class="nav-icon active" title="分析">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="M18 17V9"/>
                        <path d="M13 17V5"/>
                        <path d="M8 17v-3"/>
                    </svg>
                </div>
            </div>
            <div class="nav-bottom">
                <div class="nav-icon" title="设置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
                    </svg>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Font Panel -->
            <div class="font-panel">
                <div class="panel-header">
                    <div class="panel-title">字符集</div>
                    <select class="charset-select" id="charsetSelect">
                        <option value="3500">常用汉字 3500</option>
                        <option value="7000">常用汉字 7000</option>
                        <option value="chinese">全部汉字</option>
                    </select>
                </div>
                <div class="font-list" id="fontList">
                    <button class="add-font-btn" id="addFontBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加字体
                    </button>
                </div>
            </div>

            <!-- Chart Area -->
            <div class="chart-area">
                <div class="chart-header">
                    <div class="chart-header-left">
                        <span class="chart-title">灰度分布</span>
                        <span class="chart-subtitle" id="chartSubtitle"></span>
                    </div>
                    <div class="chart-controls">
                        <div class="bin-control" id="binControl">
                            <label>箱宽</label>
                            <input type="number" id="binSize" value="0.01" min="0.001" max="0.1" step="0.005">
                        </div>
                        <div class="chart-type-toggle">
                            <button class="chart-type-btn active" data-type="scatter" title="散点图 (字符排序)">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="5" cy="17" r="2"/>
                                    <circle cx="9" cy="11" r="2"/>
                                    <circle cx="14" cy="13" r="2"/>
                                    <circle cx="19" cy="6" r="2"/>
                                </svg>
                            </button>
                            <button class="chart-type-btn" data-type="rank" title="排名图 (百分位)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 20 L21 4"/>
                                    <circle cx="6" cy="17" r="2" fill="currentColor"/>
                                    <circle cx="12" cy="11" r="2" fill="currentColor"/>
                                    <circle cx="18" cy="5" r="2" fill="currentColor"/>
                                </svg>
                            </button>
                            <button class="chart-type-btn" data-type="histogram" title="直方图">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="14" width="5" height="7"/>
                                    <rect x="9" y="8" width="5" height="13"/>
                                    <rect x="16" y="4" width="5" height="17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="chart-container" id="chartContainer">
                    <div class="empty-state" id="emptyState">添加字体以查看灰度分布</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Font Modal -->
    <div class="modal-overlay" id="fontModal">
        <div class="modal">
            <div class="modal-title">选择字体</div>
            <div class="modal-list" id="fontModalList"></div>
            <button class="modal-close" id="modalClose">取消</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
