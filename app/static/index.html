<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg" />
    <link rel="shortcut icon" href="/static/images/favicon.ico" />
    <title>FontBench</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script> -->
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Side Navigation -->
        <nav class="side-nav">
            <div class="nav-top">
                <a href="/" class="nav-icon active" title="分析">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="M18 17V9"/>
                        <path d="M13 17V5"/>
                        <path d="M8 17v-3"/>
                    </svg>
                </a>
                <a href="/upload" class="nav-icon" title="上传">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </a>
            </div>
            <div class="nav-bottom">
                <div class="nav-icon" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Font Panel -->
            <div class="font-panel">
                <div class="panel-header">
                    <div class="panel-title">字符集</div>
                    <select class="charset-select" id="charsetSelect">
                        <option value="3500">常用汉字 3500</option>
                        <option value="7000">常用汉字 7000</option>
                        <option value="chinese">全部汉字</option>
                    </select>
                </div>
                <div class="font-list" id="fontList">
                    <button class="add-font-btn" id="addFontBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加字体
                    </button>
                </div>
            </div>

            <!-- Chart Area -->
            <div class="chart-area">
                <div class="chart-header">
                    <div class="chart-header-left">
                        <span class="chart-title">灰度分布</span>
                        <span class="chart-subtitle" id="chartSubtitle"></span>
                    </div>
                    <div class="chart-controls">
                        <div class="bin-control" id="binControl">
                            <label>箱宽</label>
                            <input type="number" id="binSize" value="0.01" min="0.001" max="0.1" step="0.005">
                        </div>
                        <div class="chart-type-toggle">
                            <button class="chart-type-btn active" data-type="scatter" title="散点图 (字符排序)">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="5" cy="17" r="2"/>
                                    <circle cx="9" cy="11" r="2"/>
                                    <circle cx="14" cy="13" r="2"/>
                                    <circle cx="19" cy="6" r="2"/>
                                </svg>
                            </button>
                            <button class="chart-type-btn" data-type="rank" title="排名图 (百分位)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 20 L21 4"/>
                                    <circle cx="6" cy="17" r="2" fill="currentColor"/>
                                    <circle cx="12" cy="11" r="2" fill="currentColor"/>
                                    <circle cx="18" cy="5" r="2" fill="currentColor"/>
                                </svg>
                            </button>
                            <button class="chart-type-btn" data-type="histogram" title="直方图">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="14" width="5" height="7"/>
                                    <rect x="9" y="8" width="5" height="13"/>
                                    <rect x="16" y="4" width="5" height="17"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="chart-container" id="chartContainer">
                    <div class="empty-state" id="emptyState">添加字体以查看灰度分布</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Font Modal -->
    <div class="modal-overlay" id="fontModal">
        <div class="modal">
            <div class="modal-title">选择字体</div>
            <div class="modal-list" id="fontModalList"></div>
            <button class="modal-close" id="modalClose">取消</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal settings-modal">
            <div class="modal-title">设置</div>
            <div class="settings-list">
                <label class="settings-item">
                    <span class="settings-label">
                        <span class="settings-name">WebGL 渲染</span>
                        <span class="settings-desc">使用 GPU 加速渲染，适合大数据集，但图像会略微模糊</span>
                    </span>
                    <input type="checkbox" id="webglToggle" class="settings-checkbox" checked>
                </label>
            </div>
            <button class="modal-close" id="settingsClose">关闭</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
